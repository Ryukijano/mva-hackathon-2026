rescue_mechanisms:
  source: "s41467-026-70521-0, Nat. Commun. 17:3829 (2026)"
  core_phenotypes:
    - microcephaly
    - chromosomal instability
    - growth restriction
    - progenitor apoptosis
  axes:
    - name: ROS_scavengers
      effect: Rescue aneuploid neuroblast numbers, progeny numbers, brain size
      examples:
        - Sod2
        - GTPx-1
    - name: mitochondrial_chaperones
      effect: Rescue aneuploid neuroblast numbers, progeny numbers, brain size
      examples:
        - Hsp60
        - Hsp60c
    - name: autophagy_mTOR
      effect: Rescue aneuploid neuroblast numbers but NOT progeny or brain size
      examples:
        - Atg1
        - Rapamycin
        - Rheb depletion
        - Tor mutants
    - name: apoptosis_blockade
      effect: Rescue progeny numbers and brain size; not neuroblast numbers
      examples:
        - p35
