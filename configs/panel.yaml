mva_panel:
  sac_core:
    description: Core spindle assembly checkpoint (tumour-predisposed)
    genes:
      - BUB1B
      - BUB1
      - MAD1L1
      - TRIP13
      - MAD2L1BP
  centrosome:
    description: Centrosome / microtubule anchoring (lower tumour risk)
    genes:
      - CEP57
      - CEP192
  minor_spliceosome:
    description: Minor spliceosome / chromosome congression
    genes:
      - CENATAC
  atelis:
    description: Atelis/MVA5-6 (SLF2-SMC5 axis, mosaic variegated hyperploidy)
    genes:
      - SLF2
      - SMC5
  extended:
    description: SAC-associated kinases, MCC subunits, kinetochore and APC/C nodes
    genes:
      - CDC20
      - TTK
      - MAD2L1
      - BUB3
      - KNL1
      - AURKA
      - PLK1

# Consequence terms considered functionally relevant for rare-disease variant ranking.
# In-frame indels are deliberately absent: neither popEVE nor AlphaMissense
# scores them, so they cannot be ranked by this pipeline.
relevant_consequences:
  - missense_variant
  - splice_acceptor_variant
  - splice_donor_variant
  - splice_region_variant
  - splice_donor_5th_base_variant
  - splice_donor_region_variant
  - splice_acceptor_region_variant
  - splice_polypyrimidine_tract_variant
  - frameshift_variant
  - stop_gained
  - stop_lost
  - start_lost
  - protein_altering_variant
  - coding_sequence_variant
